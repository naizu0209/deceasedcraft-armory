<style>
/* Layout: field-manual reference — filter strip on top, dense sortable ledger left, spec sheet docked right (stacks below on phones). */
:root{
  --bg:#f3f2ea; --panel:#fbfaf4; --sunk:#e8e7dc; --line:#d3d1c1; --line-hi:#a9a78f;
  --fg:#23241b; --muted:#6b6c58; --accent:#5f6a1f; --accent-soft:rgba(95,106,31,.12);
  --brass:#8a6516; --good:#2f7a3c; --bad:#a63a2a; --row-hi:rgba(95,106,31,.08);
  --f-display:'Saira Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14150f; --panel:#1b1d14; --sunk:#10110c; --line:#2f3222; --line-hi:#4d5236;
  --fg:#dedbc4; --muted:#8f9172; --accent:#b8c26a; --accent-soft:rgba(184,194,106,.13);
  --brass:#d3a64a; --good:#7bd389; --bad:#f08a76; --row-hi:rgba(184,194,106,.07); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14150f; --panel:#1b1d14; --sunk:#10110c; --line:#2f3222; --line-hi:#4d5236;
  --fg:#dedbc4; --muted:#8f9172; --accent:#b8c26a; --accent-soft:rgba(184,194,106,.13);
  --brass:#d3a64a; --good:#7bd389; --bad:#f08a76; --row-hi:rgba(184,194,106,.07); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);padding-inline:16px;padding-block:18px 40px}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px;border-bottom:2px solid var(--fg);padding-bottom:10px}
h1{font:800 clamp(28px,4vw,42px)/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;margin:0;text-wrap:balance}
h1 small{display:block;font:500 12px/1.4 var(--f-mono);letter-spacing:.08em;color:var(--muted);text-transform:none;margin-top:6px}
.tabrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.tally{display:flex;gap:18px;font:500 12px var(--f-mono);color:var(--muted);flex-wrap:wrap}
.tally b{display:block;font:700 24px/1 var(--f-display);color:var(--fg);letter-spacing:.02em}
.tabs{display:flex;gap:0;border:1px solid var(--line-hi);width:max-content;max-width:100%;overflow-x:auto}
.tabs button{font:700 15px var(--f-display);letter-spacing:.08em;text-transform:uppercase;background:transparent;color:var(--muted);border:0;border-right:1px solid var(--line-hi);padding:8px 18px;cursor:pointer}
.tabs button:last-child{border-right:0}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.filters{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.search{flex:0 1 280px;min-width:0;font:15px var(--f-body);padding:9px 12px;background:var(--panel);color:var(--fg);border:1px solid var(--line-hi);border-radius:2px}
.search:focus,button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chipset{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chipset .lbl{font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-right:2px}
.chip{font:500 12px var(--f-mono);padding:4px 9px;border:1px solid var(--line-hi);background:transparent;color:var(--fg);border-radius:2px;cursor:pointer}
.chip:disabled{opacity:.4;cursor:default}
.chip.gsbtn{font-size:14px;font-weight:600;padding:9px 18px;border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip.gsbtn:hover{background:var(--accent);color:var(--bg)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip i{font-style:normal;color:var(--muted);margin-left:4px}
.sortsel{font:500 12px var(--f-mono);padding:4px 8px;background:var(--panel);color:var(--fg);border:1px solid var(--line-hi);border-radius:2px;max-width:100%}
.armorin{width:72px}
.sortsel:focus{outline:2px solid var(--accent);outline-offset:1px}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:16px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}}
.ico{width:36px;height:36px;object-fit:contain;flex:none;background:var(--sunk);border:1px solid var(--line);border-radius:2px}
.ico.none{display:inline-block}
.simgrid{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:16px;align-items:stretch}
@media (max-width:980px){.simgrid{grid-template-columns:minmax(0,1fr)}}
.gs{background:#222;color:#ccc;font:13px/1.15 var(--f-mono);padding:8px 10px 9px;border:1px solid var(--line-hi);font-variant-numeric:tabular-nums}
.gs-h{display:flex;gap:8px;align-items:center;margin-bottom:5px}
.gs-h kbd{font:600 12px var(--f-mono);background:#3a3a3a;border:1px solid #555;color:#eee;padding:1px 6px}
.gs-r{display:grid;grid-template-columns:minmax(78px,96px) minmax(60px,1fr) minmax(104px,150px);gap:10px;align-items:center;padding:2.5px 0}
.gs-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs-b{display:flex;height:6px;background:#000}
.gs-b i{display:block;height:100%;background:#fff}
.gs-b i.g{background:#55ff55}.gs-b i.r{background:#ff5555}
.gs-v{white-space:nowrap}.gs-v em{font-style:normal}
.gs-v em.g{color:#55ff55}.gs-v em.r{color:#ff5555}
.gs-n{color:#999;font-size:11px;margin-top:6px}
@media (max-width:480px){.gs-r{grid-template-columns:78px 1fr;gap:4px 8px}.gs-v{grid-column:1/-1;margin-top:-2px}}
.simpair{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));align-items:start}
.slotbtn{display:flex;align-items:center;gap:8px;width:100%;min-width:0;text-align:left;font:13px var(--f-body);padding:5px 8px;background:var(--panel);color:var(--fg);border:1px solid var(--line-hi);border-radius:2px;cursor:pointer}
.slotbtn:hover:not(:disabled){border-color:var(--accent)}
.slotbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.slotbtn:disabled{opacity:.5;cursor:not-allowed;border-style:dashed}
.slotbtn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slotbtn .sub{color:var(--muted);font:11px var(--f-mono)}
.slotbtn .car{color:var(--muted)}
.slotbtn.big{gap:12px;padding:8px 14px}
.slotbtn.big .ico.sm{width:48px;height:48px}
.slotbtn.big .nm{font:700 17px var(--f-body)}
.slotbtn.big .sub{font-size:12px}
.pk{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.pk[hidden]{display:none}
.pkbox{background:var(--panel);border:1px solid var(--line-hi);width:min(980px,100%);max-height:min(88vh,860px);display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.pkhead{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.pkhead h3{margin:0;font:700 14px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);white-space:nowrap}
.pkhead input{flex:1;min-width:0}
.pkbody{overflow:auto;padding:4px 16px 16px}
.pkgrp{font:500 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.pkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px}
.pktile{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;padding:10px 6px 8px;background:var(--bg);color:var(--fg);border:1px solid var(--line);font:inherit;cursor:pointer;min-width:0}
.pktile:hover{border-color:var(--accent)}
.pktile:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pktile[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--sunk)}
.pktile .ico{width:56px;height:56px;image-rendering:pixelated}
.pktile b{font:600 12px/1.2 var(--f-body);overflow-wrap:anywhere}
.pktile em{font:400 10px var(--f-mono);font-style:normal;color:var(--muted)}
.pkempty{padding:24px 0;color:var(--muted)}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:90;max-width:min(94vw,600px);text-align:center;background:var(--panel);color:var(--fg);border:1px solid var(--bad);box-shadow:0 0 0 100vmax rgba(0,0,0,.35),0 12px 36px rgba(0,0,0,.6);padding:26px 36px;font:500 21px/1.4 var(--f-body)}
.toast .tg{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0}
.toast .ico.sm{width:44px;height:44px}
.tip{position:fixed;z-index:80;max-width:300px;background:var(--panel);color:var(--fg);border:1px solid var(--accent);box-shadow:0 8px 24px rgba(0,0,0,.5);padding:10px 12px;pointer-events:none;font:12px/1.4 var(--f-body)}
.tip[hidden]{display:none}
.tip h4{margin:0 0 2px;font:700 14px var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.tip .meta{font:11px var(--f-mono);color:var(--muted);margin-bottom:6px}
.tip p{margin:0 0 6px;color:var(--muted)}
.tip .row{display:flex;justify-content:space-between;gap:12px;font:12px var(--f-mono)}
.tip .none{color:var(--muted)}
.simpanel{border:1px solid var(--line-hi);background:var(--panel);min-width:0}
.simsel{width:100%;min-width:0;font:13px var(--f-body);padding:6px 8px;background:var(--panel);color:var(--fg);border:1px solid var(--line-hi);border-radius:2px}
.simsel:focus{outline:2px solid var(--accent);outline-offset:1px}
.fld{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;align-items:center;margin:7px 0;font-size:13px}
.fld>span:first-child{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tablewrap{overflow-x:auto}
.cvwrap{width:100%;min-width:0}
.cvwrap canvas{display:block;max-width:100%}
#simTable th{cursor:default;position:static}
.ico.sm{width:26px;height:26px;image-rendering:pixelated}
.ing{display:flex;gap:8px;align-items:center;min-width:0}
.ico.big{float:right;width:72px;height:72px;margin:0 0 8px 12px}
table.big .namecell .ico{width:42px;height:42px}
table.big .namecell .nm{font-size:15px}
table.big tbody td{font-size:14px;padding:9px 8px}
.namecell{display:flex;gap:9px;align-items:center;min-width:0}
.namecell>div{min-width:0}
.ledger{border:1px solid var(--line);background:var(--panel);overflow-x:auto;max-height:78vh;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
thead th{position:sticky;top:0;background:var(--sunk);z-index:1;font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line-hi);white-space:nowrap;cursor:pointer;user-select:none}
thead th.num{text-align:right}
thead th[data-dir="asc"]::after{content:" ▲";color:var(--accent)}
thead th[data-dir="desc"]::after{content:" ▼";color:var(--accent)}
tbody td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--row-hi)}
tbody tr.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.nm{font-weight:600}
.sub{display:block;font:400 11px var(--f-mono);color:var(--muted)}
.tag{display:inline-block;font:500 10px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;padding:1px 5px;border:1px solid var(--line-hi);border-radius:2px;color:var(--muted);white-space:nowrap}
.dim{color:var(--muted)}
.eff{font:400 12px var(--f-mono)}
.g{color:var(--good)} .b{color:var(--bad)}
.sheet{border:1px solid var(--line-hi);background:var(--panel);position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);max-height:calc(100vh - 20px);overflow-y:auto}
@media (max-width:980px){.sheet{position:static;max-height:none}}
.sheet-h{padding:14px 16px 12px;border-bottom:2px solid var(--fg)}
.sheet-h h2{font:800 26px/1.05 var(--f-display);letter-spacing:.03em;margin:0 0 6px;text-transform:uppercase;text-wrap:balance}
.sheet-h .ids{font:400 11px var(--f-mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sheet-h p{margin:8px 0 0;color:var(--muted);font-size:13px;max-width:60ch}
.sec{padding:12px 16px;border-bottom:1px solid var(--line)}
.sec h3{font:700 13px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.spec{background:var(--panel);padding:7px 9px;min-width:0}
.spec span{display:block;font:500 10px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.spec span.g{color:var(--good)}.spec span.b{color:var(--bad)}
.spec span.nv{display:inline;font:inherit;text-transform:none;letter-spacing:0}
.spec b{font:600 15px var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.spec em{font:400 11px var(--f-mono);font-style:normal;color:var(--muted)}
.ladder{display:flex;flex-wrap:wrap;gap:4px}
.ladder div{flex:1 1 80px;border:1px solid var(--line);padding:5px 8px;font:12px var(--f-mono)}
.ladder div b{display:block;font-size:15px}
ul.mats{list-style:none;margin:0;padding:0;display:grid;gap:3px}
ul.mats li{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-bottom:1px dotted var(--line);padding:2px 0}
ul.mats li b{font-family:var(--f-mono);white-space:nowrap}
.alist{display:flex;flex-wrap:wrap;gap:4px}
.alink{font:500 12px var(--f-body);padding:3px 8px;border:1px solid var(--line-hi);border-radius:2px;background:transparent;color:var(--fg);cursor:pointer;text-align:left}
.alink:hover{border-color:var(--accent);color:var(--accent)}
details{margin-top:6px}
details summary{cursor:pointer;font:600 12px var(--f-mono);color:var(--muted);padding:3px 0}
details summary b{color:var(--fg)}
.empty{padding:28px 16px;color:var(--muted);text-align:center}
.count{font:500 12px var(--f-mono);color:var(--muted)}
@media (prefers-reduced-motion:no-preference){tbody tr{transition:background .12s}}
</style>

<div class="wrap">
  <header>
    <h1>DeceasedCraft Armory<small>TaCZ guns, attachments and ammo · pack <span id="packVer">CB 5.11.19</span> · by naizu0209 · <span id="webVer">v1.1.9</span></small></h1>
    <div class="tally" id="tally"></div>
  </header>

  <div class="tabrow"><div class="tabs" role="tablist" id="tabs">
    <button role="tab" id="tab-guns" data-tab="guns" aria-selected="true">Guns</button>
    <button role="tab" id="tab-atts" data-tab="atts" aria-selected="false">Attachments</button>
    <button role="tab" id="tab-ammo" data-tab="ammo" aria-selected="false">Ammo</button>

  <div class="filters" id="filtersWrap">

<script>
const D = __DATA__;
const PACK = {tacz:'TaCZ', gz:'GZ', bf1:'BF1', suffuse:'Suffuse', rebel:'Rebel', gucci_attachments:'Gucci'};
const GTYPE = {pistol:'Pistol', smg:'SMG', shotgun:'Shotgun', rifle:'Rifle', mg:'HMG', sniper:'Sniper', rpg:'Special'};
const GUN_ORDER = ['pistol', 'smg', 'shotgun', 'rifle', 'mg', 'sniper', 'rpg'];
const ATYPE = {scope:'Scope', muzzle:'Muzzle', grip:'Grip', stock:'Stock', extended_mag:'Mag', laser:'Laser', bayonet:'Bayonet'};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fx = (n, d=2) => n == null || n === '' ? '—' : (typeof n === 'number' ? +n.toFixed(d) : n);
const prettyId = id => {
  if (!id) return '';
  const tag = id.startsWith('#');
  let s = id.replace(/^#/, '').split(':').pop();
  if (tag && s.includes('/')) { const [a, b] = s.split('/'); s = b + ' ' + a; }
  s = s.replace(/[_/]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  return tag ? s + ' (any)' : s;
};
const ICONS = D.icons || {};
const ico = (id, cls = '') => ICONS[id] ? `<img class="ico ${cls}" src="${ICONS[id]}" alt="" loading="lazy" decoding="async">` : `<span class="ico none ${cls}"></span>`;
const nameCell = (x, n) => `<div class="namecell">${ico(x.id)}<div><span class="nm">${esc(n)}</span><span class="sub">${esc(x.id)}</span></div></div>`;
const ING = D.ingIcons || {};
const ingIco = id => ING[id] ? `<img class="ico sm" src="${ING[id]}" alt="" loading="lazy" decoding="async">` : '<span class="ico sm none"></span>';
const NAMES = D.names;
const nameOf = id => NAMES[id] || prettyId(id);

// ---- derived data
// TaCZ: "damage" is per shot; each pellet deals damage / bullet_amount.
if (D.meta && D.meta.pack) document.getElementById('packVer').textContent = D.meta.pack;
const GUNS = D.guns.map(g => ({...g,
  perPellet: g.damage != null ? g.damage / (g.pellets || 1) : null,
  dps: g.damage != null && g.rpm ? g.damage * g.rpm / 60 : null,
  hay: [g.name, g.id, g.ammoName, g.ammo, g.type, GTYPE[g.type], g.desc, ...(g.recipe ? g.recipe.mats.map(m => prettyId(m.id) + ' ' + m.id) : [])].join(' ').toLowerCase()
}));
const GUN_BY_ID = Object.fromEntries(GUNS.map(g => [g.id, g]));

// ---- armor model
// TaCZ splits each hit: armor_ignore share bypasses armor, the rest goes through vanilla
// CombatRules.getDamageAfterAbsorb: dmg *= 1 - f/25.
// Armor points only (no toughness): f = clamp(armor - dmg / 2, armor / 5, 20).
let ARMOR_PTS = 0;
try { const s = parseFloat(localStorage.getItem('armory_armor_pts2')); if (s >= 0 && s <= 100) ARMOR_PTS = s; } catch (e) {}
function hitAfterArmor(d, ai, A) {
  ai = Math.min(1, Math.max(0, ai || 0));
  const dn = d * (1 - ai);
  const f = Math.min(20, Math.max(A * 0.2, A - dn / 2));

// row: [label, base, cur, scale, better ('high'|'low'), digits, suffix, prefix]; bar = value / scale, white to the lower of base and cur,
// green where it got better, red where it got worse.
function gameStats(g, ids, en, opt) {
  const base = buildStats(g, []), b = (ids && ids.length) || Object.values(en || {}).some(v => v) || opt ? buildStats(g, ids || [], en, opt) : base;
  const sp = (o, k) => (o.spread[k] == null ? 0 : o.spread[k]);
  const eff = o => Math.min(o.fullRange, 1024);
  const rows = [
    ['Ammo', base.mag, b.mag, 100, 'high', 0, ''],
    ['SPT', g.sprint, g.sprint, 0.5, 'low', 2, 's'],
    ['ADS', base.ads, b.ads, 0.5, 'low', 2, 's'],
    ['Ammo Speed', base.speed / 2, b.speed / 2, 600, 'high', 0, 'm/s'],
    ['AP Ratio', base.pen * 100, b.pen * 100, 100, 'high', 1, '%'],
    ['Damage', base.damage, b.damage, 50, 'high', 2, ''],
    ['Eff.Range', eff(base), eff(b), 100, 'high', 1, 'm'],
    ['Headshot', base.headshot, b.headshot, 5, 'high', 1, '', 'x'],
    ['Hipfire', sp(base, 'stand'), sp(b, 'stand'), 10, 'low', 2, ''],
    ['Sneak Spread', sp(base, 'sneak'), sp(b, 'sneak'), 5, 'low', 2, ''],
    ['Crawl Spread', sp(base, 'lie'), sp(b, 'lie'), 5, 'low', 2, ''],
    ['Accuracy', (1 - sp(base, 'aim')) * 100, (1 - sp(b, 'aim')) * 100, 100, 'high', 1, '%'],
    ['Knockback', base.knockback, b.knockback, 1, 'high', 2, ''],
    ['Pierce', base.pierce, b.pierce, 5, 'high', 0, ''],
    ['Ver.Recoil', base.recoilV, b.recoilV, 5, 'low', 2, ''],
    ['Hor.Recoil', base.recoilH, b.recoilH, 5, 'low', 2, ''],
    ['RPM', base.rpm, b.rpm, 1200, 'high', 0, 'rpm'],
    ['Weight', base.weight, b.weight, 20, 'low', 2, 'kg'],
  ];
  const mode = (opt && opt.mode ? [opt.mode] : (g.modes && g.modes.length) ? g.modes : ['semi']).map(m => m.toUpperCase()).join(' / ') + (opt && opt.dual && dualOk(g) ? ' · DUAL' : '');
  const html = rows.map(([l, a, c, sc, better, d, u, pre]) => {
    if (a == null || c == null || !isFinite(a) && !isFinite(c)) return isFinite(c) || a == null ? '' : `<div class="gs-r"><span class="gs-l">${l}</span><span class="gs-b"><i style="width:100%"></i></span><span class="gs-v">∞</span></div>`;
    const pa = Math.min(Math.max(a / sc, 0), 1), pc = Math.min(Math.max(c / sc, 0), 1), lo = Math.min(pa, pc), hi = Math.max(pa, pc);
    const diff = +(c - a).toFixed(d), up = diff > 0, good = (better === 'high') === up;
    const cls = diff === 0 ? '' : good ? 'g' : 'r';
    const txt = (pre || '') + c.toFixed(d) + u + (diff === 0 ? '' : ` <em class="${cls}">(${diff > 0 ? '+' : '−'}${Math.abs(diff).toFixed(d)}${u === '%' ? '%' : ''})</em>`);
    return `<div class="gs-r"><span class="gs-l">${l}</span><span class="gs-b"><i style="width:${(lo * 100).toFixed(2)}%"></i>${hi > lo ? `<i class="${cls || 'g'}" style="width:${((hi - lo) * 100).toFixed(2)}%"></i>` : ''}</span><span class="gs-v">${txt}</span></div>`;
  }).join('');
  return `<div class="gs"><div class="gs-h"${opt && g.modes && g.modes.length > 1 ? ' data-cycle="1" title="Click to switch fire mode" style="cursor:pointer"' : ''}><kbd>S</kbd><span>Fire Mode: ${esc(mode)}</span></div>${html}<div class="gs-n">Bars use TaCZ's own scales. Ammo Speed is the pack value; this pack doubles it in flight.</div></div>`;
}

function gsAddSec(a) {

// what the attachment does to one gun's stats (same numbers as the Gunsmith's build vs base)
function attFx(a, g, title) {
  const mine = g.id === SIM.gun;
  const head = `<h3>${title}${mine ? ' · your build' : ''}</h3>`;
  if (!a.guns.includes(g.id)) return `<div class="sec">${head}<div class="dim">Does not fit this gun.</div></div>`;
  // on the Gunsmith gun: compare against the build as it is now (this attachment swapped into its slot, or removed if it is already equipped)
  let b0, b1;
  if (mine) {
    const cur = {...SIM.att}, en = simEn(), opt = simOpt();
    const without = {...cur, [a.type]: ''}, withIt = {...cur, [a.type]: a.id};
    const ids = o => Object.values(o).filter(Boolean);
    if (cur[a.type] === a.id) { b0 = buildStats(g, ids(without), en, opt); b1 = buildStats(g, ids(cur), en, opt); }
    else { b0 = buildStats(g, ids(cur), en, opt); b1 = buildStats(g, ids(withIt), en, opt); }
  } else { b0 = buildStats(g, []); b1 = buildStats(g, [a.id]); }
  const rows = [
    ['Damage', b => b.damage, 2, 1, ''], ['DPS', b => b.damage * b.rpm / 60, 0, 1, ''], ['Armor pen', b => b.pen * 100, 0, 1, '%'],
    ['Fire rate', b => b.rpm, 0, 1, ''], ['Headshot', b => b.headshot, 2, 1, '×'], ['Range', b => Math.min(b.fullRange, 1024), 0, 1, ' m'],
    ['Bullet speed', b => b.speed, 0, 1, ''], ['Magazine', b => b.mag, 0, 1, ''], ['ADS time', b => b.ads, 2, 0, ' s'],
    ['Hip spread', b => b.spread.stand, 2, 0, ''], ['ADS spread', b => b.spread.aim, 2, 0, ''],
    ['Recoil V', b => b.recoilV, 2, 0, ''], ['Recoil H', b => b.recoilH, 2, 0, ''], ['Weight', b => b.weight, 2, 0, ' kg'],
  ].map(([l, f, d, hi, u]) => {
    const x = f(b0), y = f(b1); if (!isFinite(x) || !isFinite(y) || +(y - x).toFixed(d) === 0) return '';
    const c = (y > x) === !!hi ? 'g' : 'b';
    return [c, spec(l, `${x.toFixed(d)} → <span class="nv ${c}">${y.toFixed(d)}${u}</span>`)];
  }).filter(Boolean).sort((x, y) => (x[0] === 'g' ? 0 : 1) - (y[0] === 'g' ? 0 : 1)).map(x => x[1]).join('');
  return `<div class="sec">${head}${rows ? `<div class="specs">${rows}</div>` : '<div class="dim">No stat change on this gun.</div>'}</div>`;
}

// --- attachment modifier math: (base + sum addend) * (1 + sum percent) * product multiplier, formulas first
function exprEval(s, x) {

    case 'bullet_retention': return pct(enPct(p) * l).replace('+', '') + ' chance a shot uses no ammo';
  }

}
function renderSimEnch() {
  const roman = ['', 'I', 'II', 'III', 'IV', 'V'], noCap = ENCH_NO_CAP.has(SIM.gun);
  $('simEnch').innerHTML = ENCH.map(([k, name, max, tip]) => {
    const off = k === 'capacity' && noCap, cur = off ? 0 : SIM.ench[k] || 0;
    return `<div class="fld"><span title="${esc(tip)}">${esc(name)}</span><div class="chipset">${Array.from({length: max + 1}, (_, i) => `<button class="chip" type="button" data-ench="${k}" data-lvl="${i}" title="${esc(off ? 'This gun cannot take it' : name + (i ? ' ' + roman[i] : '') + ': ' + enchTxt(k, i))}" aria-pressed="${i === cur}"${off && i ? ' disabled' : ''}>${i ? roman[i] : 'Off'}</button>`).join('')}</div></div>`;
  }).join('');
}
function syncSimInputs() {
  const setv = (id, v) => { const el = $(id); if (document.activeElement !== el) el.value = v; };
  setv('simHp', SIM.hp); setv('simArmor', SIM.armor); setv('simBonus', SIM.bonus); setv('simRange', SIM.range); $('simRangeVal').textContent = SIM.range;
  $('simPreset').value = SIM.preset;
  for (const b of $('simStance').children) b.setAttribute('aria-pressed', b.dataset.stance === SIM.stance);
  for (const b of $('simZone').children) b.setAttribute('aria-pressed', b.dataset.zone === SIM.zone);
  for (const b of $('simReaim').children) b.setAttribute('aria-pressed', (b.dataset.reaim === '1') === SIM.reaim);
  for (const b of $('simRec').children) b.setAttribute('aria-pressed', (b.dataset.rec === '1') === SIM.rec);
}

// ---------- recoil panel: crosshair path of a sustained spray, with no mouse compensation
const REC_N = 30;
function recoilStats(b) {
  const gap = 60 / b.rpm, c = recoilCurve(b, SIM.stance, null), res = recRes(), pre = recoilPre(b, SIM.stance, REC_N, null, res);
  let peak = 0; for (let t = 0; t <= (c.p ? c.p.end : 0); t += 0.005) peak = Math.max(peak, Math.abs(kickAt(c.p, t)));
  const n = Math.min(REC_N, b.mag), last = pre[n - 1] || {p: 0, y: 0};
  return {gap, peak: peak * res.p, climb: kickAt(c.p, gap) * res.p, drift: kickAt(c.y, gap) * res.y, n, total: last.p, side: last.y, end: Math.max(c.p ? c.p.end : 0, c.y ? c.y.end : 0)};
}
function drawRecoil() {
  const b = SIM.b, o = simOpts(); if (!b) return;
  const {c, w, h} = prep($('simRecC'), 560), L = 44, R = 12, T = 14, B = 30, pw = w - L - R, ph = h - T - B;
  const n = Math.min(REC_N, b.mag), gap = 60 / b.rpm, rs = recoilStats(b);
  // sample a path of the crosshair through the whole spray
  const res = recRes();
  const path = rand => {
    const pts = [[0, 0]]; let p = 0, y = 0;
    for (let k = 0; k < n; k++) {
      const cu = recoilCurve(b, o.stance, rand), len = k === n - 1 ? Math.max(rs.end, gap) : gap;
      for (let t = 0.01; t < len + 1e-9; t += 0.01) pts.push([-(y + kickAt(cu.y, t) * res.y), p + kickAt(cu.p, t) * res.p]);
      p += kickAt(cu.p, gap) * res.p; y += kickAt(cu.y, gap) * res.y;
    }
    return pts;
  };
  const mean = path(null), rand = rng(4242), trials = []; for (let i = 0; i < 6; i++) trials.push(path(rand));
  const sp = b.spread[o.stance] || 0, pre0 = recoilPre(b, o.stance, n, null, res);
  const all = mean.concat(...trials, ...pre0.map(q => [[-q.y - sp, q.p - sp], [-q.y + sp, q.p + sp]])), aimY = aimYOf(o.zone), deg = v => Math.atan(v / o.range) * 180 / Math.PI;
  const bx = deg(0.45), by0 = deg(0 - aimY), hy1 = deg(1.8 - aimY);
  let x0 = Math.min(...all.map(p => p[0]), -bx), x1 = Math.max(...all.map(p => p[0]), bx), y0 = Math.min(...all.map(p => p[1]), by0), y1 = Math.max(...all.map(p => p[1]), hy1);
  const padx = (x1 - x0) * 0.08 || 0.5, pady = (y1 - y0) * 0.08 || 0.5; x0 -= padx; x1 += padx; y0 -= pady; y1 += pady;
  // keep degrees square so the path is not distorted
  const sc = Math.min(pw / (x1 - x0), ph / (y1 - y0)), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const X = x => L + pw / 2 + (x - cx) * sc, Y = y => T + ph / 2 - (y - cy) * sc;
  const fg = cssv('--fg'), mu = cssv('--muted'), ln = cssv('--line'), acc = cssv('--accent'), bad = cssv('--bad');
  c.font = '11px ' + cssv('--f-mono'); c.lineWidth = 1; c.strokeStyle = ln; c.fillStyle = mu;
  // target silhouette at this range, in degrees from the crosshair at rest
  drawPlayer(c, xm => X(deg(xm)), ym => Y(deg(ym - aimY)), mu);
  c.strokeStyle = ln; c.beginPath(); c.moveTo(X(0), T); c.lineTo(X(0), T + ph); c.moveTo(L, Y(0)); c.lineTo(L + pw, Y(0)); c.stroke();
  const line = (pts, col, wd, al) => { c.strokeStyle = col; c.lineWidth = wd; c.globalAlpha = al; c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(X(x), Y(y)) : c.moveTo(X(x), Y(y))); c.stroke(); c.globalAlpha = 1; };
  for (const t of trials) line(t, mu, 1, 0.55);
  // stance spread: a cone around the crosshair at every shot, with a random impact per pellet
  const R2 = sp * sc, ir = rng(777);
  c.strokeStyle = mu; c.lineWidth = 1; c.globalAlpha = 0.5; c.setLineDash([3, 3]);
  for (const q of [pre0[0], pre0[pre0.length - 1]]) { c.beginPath(); c.arc(X(-q.y), Y(q.p), Math.max(1, R2), 0, 6.2832); c.stroke(); }
  c.setLineDash([]); c.globalAlpha = 0.8; c.fillStyle = fg;
  const per = Math.max(1, Math.min(b.pellets, 12));
  for (const q of pre0) for (let i = 0; i < per; i++) { const r = sp * Math.sqrt(ir()), a = ir() * 6.2832; c.fillRect(X(-q.y + r * Math.cos(a)) - 1, Y(q.p + r * Math.sin(a)) - 1, 2, 2); }
  c.globalAlpha = 1;
  // a dot where each shot fires
  const pre = recoilPre(b, o.stance, n, null, res); c.fillStyle = bad;
  pre.forEach((q, k) => { c.beginPath(); c.arc(X(-q.y), Y(q.p), 2.6, 0, 6.2832); c.fill(); if (k === 0 || k === n - 1) { c.fillStyle = fg; c.textAlign = 'left'; c.fillText(String(k + 1), X(-q.y) + 6, Y(q.p) - 4); c.fillStyle = bad; } });
  c.fillStyle = mu; c.textAlign = 'center';
  c.fillText('left ←  sideways (°)  → right', L + pw / 2, h - 6);
  c.save(); c.translate(11, T + ph / 2); c.rotate(-Math.PI / 2); c.fillText('up (°)', 0, 0); c.restore();
  c.textAlign = 'right'; c.fillText(fx(y1, 1) + '°', L - 5, T + 10); c.fillText(fx(y0, 1) + '°', L - 5, T + ph);
  c.textAlign = 'left'; c.fillStyle = fg; c.fillText(`player at ${o.range} m`, L + 6, T + ph - 6);
  
}
function recoilCards() {
  const b = SIM.b, r = recoilStats(b), m = Math.tan(r.total * Math.PI / 180) * SIM.range;
  const cards = [
    ['Kick (peak)', fx(r.peak, 2) + '°', 'one shot'],
    ['Climb per shot', fx(r.climb, 2) + '°', 'at ' + fx(60 / r.gap, 0) + ' rpm'],
    ['Climb after ' + r.n, fx(r.total, 1) + '°', fx(m, 1) + ' m high at ' + SIM.range + ' m'],
    ['Recovers in', fx(r.end, 2) + ' s', 'after last shot'],
  ];
  $('simRecCards').innerHTML = cards.map(([l, v, e]) => `<div class="spec"><span>${l}</span><b>${v}</b>${e ? ` <em>${e}</em>` : ''}</div>`).join('');
}

function updateSim(skipCharts) {
  const g = GUN_BY_ID[SIM.gun];
  renderGunOpts();
  SIM.slots[SIM.slot] = snapBuild(); renderBuilds();
  SIM.b = buildStats(g, simIds(), simEn(), simOpt());
  const b = SIM.b, base = buildStats(g, []), o = simOpts();
  $('simGunMeta').textContent = `${g.ammoName} · ${GTYPE[g.type] || g.type} · ${(g.modes || []).join('/')} · ${g.reloadType || ''}`;
  $('simTable').innerHTML = gameStats(g, simIds(), simEn(), simOpt());
  const dB = shotDamageAt(base, SIM.range), dC = shotDamageAt(b, SIM.range);
  $('simAtRange').textContent = 'Damage per shot at ' + SIM.range + ' m: ' + fx(dC, 2) + (Math.abs(dC - dB) > 0.005 ? ' (base ' + fx(dB, 2) + ')' : '') + (b.pellets > 1 ? ' across ' + b.pellets + ' pellets' : '');
  $('simFlags').innerHTML = [b.silenced && 'Suppressed', b.explode && (b.explDamage ? 'Explosion ' + fx(b.explDamage, 0) + ' dmg · r ' + fx(b.explRadius, 1) + ' m' : 'Explosive rounds'), b.ignite && 'Incendiary · burns ' + BURN_DPS + ' hp/s', b.charge > 0 && 'Charges ' + fx(b.charge, 2) + ' s per shot', b.heat && 'Overheats after ' + Math.ceil(b.heat.max / b.heat.perShot) + ' shots'].filter(Boolean).map(t => `<span class="tag">${t}</span>`).join('');

  const r = summarize(b, g, o, 300, 1500);
  const hitBody = idealHit(b, SIM.range, SIM.armor, false, SIM.bonus), hitHead = idealHit(b, SIM.range, SIM.armor, true, SIM.bonus);
  const cards = [
    ['Hit chance', fx(r.hitPct * 100, 0) + '%', b.pellets > 1 ? 'of ' + b.pellets + ' pellets' : 'per shot'],
    ['Per hit (body / head)', fx(hitBody, 1) + ' / ' + fx(hitHead, 1), 'after armor, no spread' + (b.explDamage ? ', incl. explosion' : '')],
    ['Shots to kill', isFinite(r.shotsMed) ? fx(r.shotsMed, 0) : '—', 'median'],
    ['Time to kill', isFinite(r.ttk0) ? fx(r.ttk0, 2) + ' s' : 'no kill', 'no reload'],
    ['Time to kill with reload', isFinite(r.ttkMed) ? fx(r.ttkMed, 2) + ' s' : 'no kill', isFinite(r.ttkP90) ? '90%: ' + fx(r.ttkP90, 2) + ' s' : ''],
  ];
  $('simCards').innerHTML = cards.map(([l, v, e]) => `<div class="spec"><span>${l}</span><b>${v}</b>${e ? ` <em>${e}</em>` : ''}</div>`).join('');
  syncSimInputs(); recoilCards();
  for (const k of KINDS) { if (SIM.du[k].duel) stopDuel(k); else drawDuel(k, 0); }
  if (!skipCharts) { clearTimeout(SIM.timer); SIM.timer = setTimeout(drawSimCharts, 40); }
}
function drawSimCharts() {
  if (!SIM.b) return;
  drawRecoil();
}

function initSim() {
  if (!SIM.ready) {
    SIM.ready = true;
    if (!GUN_BY_ID[SIM.gun]) SIM.gun = GUNS.find(g => g.damage != null).id;
    const z = TARGETS.findIndex(t => t.name === 'Zombie'); if (z >= 0) { SIM.preset = String(z); SIM.hp = TARGETS[z].hp; SIM.armor = TARGETS[z].armor; }
    renderSimShell();
    const wrap = $('simWrap');
    wrap.addEventListener('change', e => {
      const t = e.target;
      if (t.id === 'simPreset') { const p = TARGETS[+t.value]; SIM.preset = t.value; if (p) { SIM.hp = p.hp; SIM.armor = p.armor; } updateSim(); }
      else if (t.id === 'simSpeed') SIM.speed = +t.value;
    });
    wrap.addEventListener('input', e => {
      const t = e.target, v = parseFloat(t.value);
      if (t.id === 'simHp' && v > 0) { SIM.hp = v; SIM.preset = ''; updateSim(); }
      else if (t.id === 'simArmor' && v >= 0) { SIM.armor = Math.min(100, v); SIM.preset = ''; updateSim(); }
      else if (t.id === 'simBonus' && isFinite(v)) { SIM.bonus = Math.max(-100, Math.min(1000, v)); updateSim(); }
      else if (t.id === 'simRange') { SIM.range = v; updateSim(); }
    });
    wrap.addEventListener('click', e => {
      if (e.target.closest('[data-cycle]')) { const ms = (GUN_BY_ID[SIM.gun] || {}).modes || []; if (ms.length > 1) { SIM.mode = ms[(ms.indexOf(SIM.mode) + 1) % ms.length]; updateSim(); } return; }
      const t = e.target.closest('button'); if (!t) return;
      if (t.dataset.stance) { SIM.stance = t.dataset.stance; updateSim(); }
      else if (t.dataset.zone) { SIM.zone = t.dataset.zone; updateSim(); }
      else if (t.dataset.mode) { SIM.mode = t.dataset.mode; updateSim(); }
      else if (t.dataset.dual) { SIM.dual = t.dataset.dual === '1'; updateSim(); }
      else if (t.dataset.reaim) { SIM.reaim = t.dataset.reaim === '1'; updateSim(); }
      else if (t.dataset.rec) { SIM.rec = t.dataset.rec === '1'; updateSim(); }
      else if (t.id === 'simGunBtn') pickGun(t);
      else if (t.dataset.slot) gotoAtts(t.dataset.slot);
      else if (t.dataset.ench) { SIM.ench[t.dataset.ench] = +t.dataset.lvl; renderSimEnch(); updateSim(); }
      else if (t.id === 'simClear') { SIM.att = {}; renderSimAtts(); updateSim(); }
      else if (t.id === 'simFire') { const st = SIM.du.dummy; if (st.raf && st.duel) freezeDuel('dummy'); else startDuel('dummy'); }
    });
    window.addEventListener('resize', () => { if (!$('simWrap').hidden && SIM.b) { drawRecoil(); for (const k of KINDS) { const d = SIM.du[k].duel; drawDuel(k, d ? Math.min(d.end, (performance.now() - d.start) / 1000 * SIM.speed) : 0); } drawSimCharts(); } });
    if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!$('simWrap').hidden) { updateSim(); } });

}
